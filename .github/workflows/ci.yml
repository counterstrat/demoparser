name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    name: Test Rust Workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "21.12"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Run workspace tests
        run: cargo test --workspace

  test_python_bindings:
    name: Test Python Bindings
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: src/python
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: src/python/pyproject.toml

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "21.12"

      - name: Run signature test
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install \
            "maturin==1.16.0" \
            "patchelf==0.19.3.0" \
            "mypy==1.14.1; python_version == '3.8'" \
            "mypy==1.19.1; python_version == '3.9'" \
            "mypy==2.4.1; python_version >= '3.10'" \
            "pandas==2.0.3; python_version == '3.8'" \
            "pandas==2.3.3; python_version >= '3.9' and python_version < '3.11'" \
            "pandas==3.1.1; python_version >= '3.11'" \
            "pandas-stubs==2.0.3.230814; python_version == '3.8'" \
            "pandas-stubs==2.2.2.240807; python_version == '3.9'" \
            "pandas-stubs==2.3.3.260113; python_version == '3.10'" \
            "pandas-stubs==3.1.0.261029; python_version >= '3.11'"

          maturin develop
          python3 tests/signature_tests.py
          python3 -m mypy.stubtest counterstrat_demoparser --allowlist tests/mypy-stubtest-allowlist.txt

  test_node_bindings:
    name: Test Node and Wasm Bindings (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24", "26"]
    defaults:
      run:
        working-directory: src/node
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "21.12"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: src/node/package-lock.json

      - name: Install wasm-pack
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: wasm-pack@0.13.1

      - name: Install dependencies
        run: npm ci

      - name: Build native binding
        run: npm run build:native

      - name: Check native export parity
        run: npm run check:exports

      - name: Build wasm package
        run: npm run build:wasm

      - name: Check wasm export parity
        run: npm run check:wasm

      - name: Run JS tests
        run: npm test

  all-green:
    name: All Gates Passed
    runs-on: ubuntu-latest
    needs: [build_and_test, test_python_bindings, test_node_bindings]
    if: always()
    steps:
      - name: Verify required jobs succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1

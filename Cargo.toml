[workspace]
resolver = "2"
members = [
  "src/csgoproto",
  "src/git-mirror",
  "src/node",
  "src/parser",
  "src/python",
  "src/wasm",
]

[workspace.package]
version = "0.1.0"
# Tracks the MSRV required by polars 0.55.2, the Python binding's main dependency.
rust-version = "1.95"

[profile.dev]
overflow-checks = false

[profile.release]
debug = true
lto = true

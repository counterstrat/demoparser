[package]
edition = "2021"
name = "counterstrat_demoparser"
version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
ahash = "0.8.3"
memmap2 = "0.9.4"
# Default enable napi4 feature, see https://nodejs.org/api/n-api.html#node-api-version-matrix
napi = { version = "3", default-features = false, features = ["napi6","serde-json"] }
napi-derive = "3"
serde_json = "1.0.96"
protobuf-support = "3.3.0"
itertools = "0.12.1"
rayon = "1.10.0"

[build-dependencies]
# napi-build has no stable 3.x on crates.io; 3.0.0-beta.0 is yanked.
# https://crates.io/crates/napi-build/versions
# The napi 3 migration guide baseline resolves through this 2.6.x line:
# https://napi.rs/docs/more/v2-v3-migration-guide
napi-build = "2.6.0"

[dependencies.parser]
package = "counterstrat-demoparser"
path = "../parser"

[dependencies.csgoproto]
path = "../csgoproto"
[target.'cfg(not(target_env = "msvc"))'.dependencies]
